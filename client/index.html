<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Default meta — og-meta.ts overrides these for /events/:id, /groups/:slug, /guides/:slug -->
    <title>Expat Events Moscow</title>
    <meta name="description" content="Events, communities, and guides for expats in Moscow. Find language exchanges, social meetups, networking events, and more." />
    <link rel="canonical" href="https://expatevents.org" />

    <!-- Default Open Graph (homepage / any page without server-injected meta) -->
    <meta property="og:type"         content="website" />
    <meta property="og:site_name"    content="Expat Events Moscow" />
    <meta property="og:url"          content="https://expatevents.org" />
    <meta property="og:title"        content="Expat Events Moscow" />
    <meta property="og:description"  content="Events, communities, and guides for expats in Moscow. Find language exchanges, social meetups, networking events, and more." />
    <meta property="og:image"        content="https://expatevents.org/og-default.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Expat Events Moscow" />
    <meta name="twitter:description" content="Events, communities, and guides for expats in Moscow." />
    <meta name="twitter:image"       content="https://expatevents.org/og-default.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Fonts: preload + non-blocking swap to eliminate render-blocking & FOUT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Geist:wght@100..900&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Geist:wght@100..900&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
